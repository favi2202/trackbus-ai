name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  analytics:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analytics-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest
      - name: Validate sensor replay tool
        working-directory: .
        run: PYTHONPATH=tools python -m unittest discover -s tools/tests
