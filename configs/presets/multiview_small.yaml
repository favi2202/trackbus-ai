# Example small-model overlapping views: recalibrate bounds for each camera.
model: {path: yolo11s.pt, confidence: 0.20, imgsz: 640, half: false}
device: auto
tracking:
  tracker: configs/bytetrack_trackbus.yaml
  minimum_zone_frames: 3
  stale_track_timeout: 90
camera:
  inference_views:
    - {name: full, bounds: [0.0, 0.0, 1.0, 1.0], enabled: true}
    - {name: left_doorway, bounds: [0.0, 0.15, 0.62, 1.0], enabled: true}
    - {name: right_doorway, bounds: [0.38, 0.15, 1.0, 1.0], enabled: true}
detection_fusion:
  method: nms
  iou_threshold: 0.50
  confidence_strategy: maximum
  prefer_full_frame: false
zones:
  outside: [[0.05, 0.05], [0.95, 0.05], [0.95, 0.40], [0.05, 0.40]]
  inside: [[0.05, 0.60], [0.95, 0.60], [0.95, 0.95], [0.05, 0.95]]
outputs: {video: data/output/multiview_small.mp4}
