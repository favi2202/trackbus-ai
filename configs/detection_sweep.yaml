# Explicit detector-only comparisons. This is intentionally not a large
# Cartesian product. Remove expensive runs when testing on CPU.
version: 1
device: auto
maximum_runs: 8
low_confidence_threshold: 0.35
ground_truth_iou_threshold: 0.50
stability_iou_threshold: 0.10
edge_margin_pixels: 2

runs:
  - name: nano-640-conf-020
    model: yolo11n.pt
    image_size: 640
    confidence: 0.20

  - name: nano-960-conf-020
    model: yolo11n.pt
    image_size: 960
    confidence: 0.20

  - name: small-640-conf-020
    model: yolo11s.pt
    image_size: 640
    confidence: 0.20

  - name: small-960-conf-015
    model: yolo11s.pt
    image_size: 960
    confidence: 0.15

  - name: small-960-conf-025
    model: yolo11s.pt
    image_size: 960
    confidence: 0.25

  # This is the expensive comparison. Keep it only when GPU time is available.
  - name: medium-960-conf-020
    model: yolo11m.pt
    image_size: 960
    confidence: 0.20
