# Coordinates are normalized: [0, 0] is the top-left and [1, 1] is the
# bottom-right of any video resolution. Adjust these polygons for the camera.
model:
  path: yolo11n.pt
  confidence: 0.35
  imgsz: 640

device: auto
capacity: 40
initial_occupancy: 0
logging_level: INFO

tracking:
  tracker: configs/bytetrack_trackbus.yaml
  minimum_zone_frames: 3
  stale_track_timeout: 90

# All camera-calibration coordinates are normalized against the source frame.
# Null ROI preserves the original full-frame inference path. Configure lane
# polygons for the actual doorway before relying on lane diagnostics.
camera:
  detection_roi: null
  doorway_lanes:
    anchor: center
    left_lane: null
    center_lane: null
    right_lane: null
  # Use only for known static structures, never passenger pathways.
  exclusion_polygons: []
  debug_calibration_overlay: false

diagnostics:
  nearby_distance_normalized: 0.12
  heavy_overlap_iou: 0.50
  id_restart_window_frames: 15
  id_restart_distance_normalized: 0.08
  edge_margin_pixels: 2
  stationary_step_threshold: 0.005
  likely_static_minimum_frames: 75
  likely_static_minimum_percentage: 0.90
  wide_box_aspect_ratio: 0.90
  wide_box_doorway_ratio: 0.45
  multi_lane_minimum_box_overlap: 0.05

zones:
  outside:
    - [0.05, 0.05]
    - [0.95, 0.05]
    - [0.95, 0.40]
    - [0.05, 0.40]
  inside:
    - [0.05, 0.60]
    - [0.95, 0.60]
    - [0.95, 0.95]
    - [0.05, 0.95]

outputs:
  video: data/output/result.mp4
  # Null paths are derived from the output video name.
  events_csv: null
  summary_json: null
